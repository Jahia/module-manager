# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/core"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "production"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "production"
    ignore:
      # The Jahia parent and the Jahia test module set the minimum Jahia version of the module.
      - dependency-name: "org.jahia.modules:jahia-modules"
      - dependency-name: "org.jahia.server:*"
      - dependency-name: "org.jahia.test:jahia-test-module"
