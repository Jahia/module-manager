# The permission requirement belongs on the component, not only on the settings template that normally
# hosts it: a component's access rule should travel with the component and hold on every render path,
# regardless of where it is placed. `TemplatePermissionCheckFilter` enforces this before the view runs,
# and it propagates to every view variant via the default view's properties.
#
# `adminTemplates` is what this screen's own hosting templates declare (`j:requiredPermissionNames` on
# `manageModules` and `manageModules-jahia-anthracite`), so the component and the template now state the
# same requirement. This module's `permissions.xml` registers `adminTemplates` as a child of the core
# `admin` permission, and Jahia aggregation runs downwards only: a role granted `admin` therefore still
# holds `adminTemplates`, while a role narrowed to the screens it administers keeps this one. Requiring
# the aggregate `admin` here would refuse that narrowed role a screen its own template grants.
#
# The permission resolves wherever this screen can render, because the module that ships the screen ships
# the permission.
requirePermissions=adminTemplates
